{% extends 'store/base.html' %}
{% block content %}
<div style="max-width:420px; margin:50px auto; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); background:#fff;">
    <h2 style="text-align:center; color:#007bff; margin-bottom:10px;">Reset Password</h2>
    <p style="text-align:center; color:#666; font-size:14px; margin-bottom:20px;">
        Enter your username and choose a new password.
    </p>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom:15px;">
            <label style="font-weight:bold; display:block; margin-bottom:5px;">Username</label>
            <input type="text" name="username" value="{{ username|default:'' }}" placeholder="Enter your username" required style="width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:14px;">
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="font-weight:bold; display:block; margin-bottom:5px;">New Password</label>
            <div style="position:relative;">
                <input type="password" id="newPassword" name="new_password" placeholder="Minimum 8 characters" required style="width:100%; padding:10px 40px 10px 12px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:14px;">
                <span id="toggleNewPassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#777; font-size:15px; user-select:none;" title="Show/Hide Password">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>
            <small style="color:gray; font-size:12px;">At least 8 characters</small>
        </div>

        <div style="margin-bottom:20px;">
            <label style="font-weight:bold; display:block; margin-bottom:5px;">Confirm New Password</label>
            <div style="position:relative;">
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter new password" required style="width:100%; padding:10px 40px 10px 12px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:14px;">
                <span id="toggleConfirmPassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#777; font-size:15px; user-select:none;" title="Show/Hide Password">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>
        </div>

        <button type="submit" style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer;">
            Reset Password
        </button>
    </form>
    
    <div style="text-align:center; margin-top:20px; font-size:14px;">
        <a href="{% url 'login' %}" style="color:#007bff; text-decoration:none; font-weight:600;">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function setupToggle(buttonId, inputId) {
        const toggleBtn = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        if (toggleBtn && input) {
            toggleBtn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        }
    }
    setupToggle('toggleNewPassword', 'newPassword');
    setupToggle('toggleConfirmPassword', 'confirmPassword');
});
</script>
{% endblock %}
