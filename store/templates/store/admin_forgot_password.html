<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - Freshora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
        }
        .login-box h2 {
            margin-bottom: 8px;
            color: #28a745;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .input-wrap {
            position: relative;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.15);
        }
        .input-wrap input {
            padding-right: 42px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            font-size: 15px;
            user-select: none;
            padding: 4px;
        }
        .toggle-password:hover {
            color: #28a745;
        }
        .hint {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button[type="submit"]:hover {
            background: #218838;
        }
        .nav-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-links a {
            color: #28a745;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .nav-links a.store-link {
            color: #777;
            font-weight: 400;
        }
        .nav-links a.store-link:hover {
            color: #333;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .alert-error {
            background: #fde8e8;
            color: #c81e1e;
            border: 1px solid #f8b4b4;
        }
        .alert-success {
            background: #def7ec;
            color: #03543f;
            border: 1px solid #bcf0da;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2><i class="fa-solid fa-key"></i> Reset Admin Password</h2>
        <p class="subtitle">Enter your admin username to set a new password.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="adminUsername">Admin Username</label>
                <input type="text" id="adminUsername" name="username" value="{{ username|default:'' }}" placeholder="Enter your admin username" required>
            </div>
            
            <div class="form-group">
                <label for="adminNewPassword">New Password</label>
                <div class="input-wrap">
                    <input type="password" id="adminNewPassword" name="new_password" placeholder="Minimum 8 characters" required>
                    <span class="toggle-password" id="toggleAdminNewPassword" title="Show/Hide Password">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
                <span class="hint">Minimum 8 characters</span>
            </div>

            <div class="form-group">
                <label for="adminConfirmPassword">Confirm New Password</label>
                <div class="input-wrap">
                    <input type="password" id="adminConfirmPassword" name="confirm_password" placeholder="Re-enter new password" required>
                    <span class="toggle-password" id="toggleAdminConfirmPassword" title="Show/Hide Password">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit">Reset Admin Password</button>
        </form>

        <div class="nav-links">
            <a href="{% url 'admin_login' %}"><i class="fa-solid fa-arrow-left"></i> Back to Admin Login</a>
            <a href="{% url 'home' %}" class="store-link">Back to Freshora</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        function setupToggle(buttonId, inputId) {
            const toggleBtn = document.getElementById(buttonId);
            const input = document.getElementById(inputId);
            if (toggleBtn && input) {
                toggleBtn.addEventListener('click', function() {
                    const icon = this.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        input.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            }
        }
        setupToggle('toggleAdminNewPassword', 'adminNewPassword');
        setupToggle('toggleAdminConfirmPassword', 'adminConfirmPassword');
    });
    </script>
</body>
</html>
